name: Update Activity Log

on:
  schedule:
    # 每天 UTC 02:00（台灣時間 10:00）執行一次
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the PAT stored in the repository secret `TOKEN` so subsequent git push
          # operations are authenticated with the same token (must have repo permissions).
          token: ${{ secrets.TOKEN }}

      - name: Generate activity log
        uses: readme-workflows/recent-activity@main
        # 如果 action 因為外部 telemetry 錯誤而失敗，也不要終止整個 job
        continue-on-error: true
        with:
          # 使用 repo owner 作為預設 GH 使用者（action 預設也會使用 repository owner）
          GH_USERNAME: ${{ github.repository_owner }}
          # 指定 config 檔案（我們會在 .github/recent-activity.config.yml 建立範本）
          CONFIG_FILE: './.github/recent-activity.config.yml'
        env:
          # 用 PAT 或 repo secret 的 TOKEN 來給 action 做 push
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          # 嘗試避開 action 可能會呼叫的外部 telemetry endpoint（設為空值）
          RECENT_ACTIVITY_URL: ''
          RECENT_ACTIVITY_PASSKEY: ''
          RECENT_ACTIVITY_PARAMS: ''

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update recent activity [skip ci]" || echo "No changes"
          git push