name: Update Activity Log

on:
  schedule:
    # 每天 UTC 02:00（台灣時間 10:00）執行一次
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate activity log
        uses: Readme-Workflows/recent-activity@v2
        with:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          COMMIT_MSG: "chore: update activity log"

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update recent activity [skip ci]" || echo "No changes"
          git push